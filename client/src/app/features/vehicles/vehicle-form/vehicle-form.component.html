<div class="vehicle-form-page">
  <div class="section-header">
    <div>
      <a routerLink="/vehicles" class="back-link">← Back to Fleet Inventory</a>
      <h1>{{ isEditMode ? 'Edit Vehicle Profile' : 'Register New Fleet Vehicle' }}</h1>
      <p class="section-subtitle">{{ isEditMode ? 'Update vehicle telemetry and driver assignment' : 'Enter specs to add a vehicle to real-time operations' }}</p>
    </div>
  </div>

  <div class="card form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="alert-box">
        <span class="material-icons">error_outline</span>
        <span>{{ error }}</span>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="reg">Registration Number *</label>
          <input
            id="reg"
            type="text"
            formControlName="registration_number"
            class="form-control"
            placeholder="e.g. FS-009-KK"
          />
          <div *ngIf="form.get('registration_number')?.touched && form.get('registration_number')?.invalid" class="form-error">
            Registration number is required.
          </div>
        </div>

        <div class="form-group">
          <label for="make">Make</label>
          <input id="make" type="text" formControlName="make" class="form-control" placeholder="e.g. Toyota" />
        </div>

        <div class="form-group">
          <label for="model">Model</label>
          <input id="model" type="text" formControlName="model" class="form-control" placeholder="e.g. Hilux" />
        </div>

        <div class="form-group">
          <label for="year">Model Year</label>
          <input id="year" type="number" formControlName="year" class="form-control" placeholder="2023" />
        </div>

        <div class="form-group">
          <label for="odo">Current Odometer (km)</label>
          <input id="odo" type="number" formControlName="current_odometer_km" class="form-control" />
        </div>

        <div class="form-group">
          <label for="interval">Service Interval (km)</label>
          <input id="interval" type="number" formControlName="service_interval_km" class="form-control" placeholder="5000" />
        </div>

        <div class="form-group">
          <label for="lastOdo">Last Service Odometer (km)</label>
          <input id="lastOdo" type="number" formControlName="last_service_odometer_km" class="form-control" />
        </div>

        <div class="form-group">
          <label for="lastDate">Last Service Date</label>
          <input id="lastDate" type="date" formControlName="last_service_date" class="form-control" />
        </div>

        <div class="form-group">
          <label for="driver">Assign Driver</label>
          <select id="driver" formControlName="driver_id" class="form-control">
            <option [ngValue]="null">— Unassigned —</option>
            <option *ngFor="let driver of drivers" [ngValue]="driver.id">
              {{ driver.name }} ({{ driver.license_number }})
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Operating Status</label>
          <select id="status" formControlName="status" class="form-control">
            <option value="active">Active</option>
            <option value="in_service">In Service</option>
            <option value="retired">Retired</option>
          </select>
        </div>
      </div>

      <div class="card-footer" style="padding-left: 0; padding-right: 0; background: transparent; margin-top: 24px;">
        <a routerLink="/vehicles" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="loading || form.invalid">
          <span class="material-icons">save</span>
          <span>{{ loading ? 'Saving...' : isEditMode ? 'Update Vehicle' : 'Register Vehicle' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
